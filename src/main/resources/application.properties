spring.application.name=movies-api

# Puerto de la aplicación: se cambia de 8080 (por defecto) a 8081 porque
# Adobe Connect ocupa el 8080 en este equipo
server.port=8081

# Ahora sí activamos Docker Compose: Spring Boot detectará el compose.yaml
# y levantará automáticamente el contenedor de MySQL al arrancar la app
spring.docker.compose.enabled=true

# Configuración de conexión a MySQL (contenedor Docker).
# El puerto 3308 es el que mapeamos en compose.yaml hacia el 3306 interno
spring.datasource.url=jdbc:mysql://localhost:3308/moviesdb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=myuser
spring.datasource.password=secret

# ddl-auto=update: Hibernate crea/actualiza las tablas automáticamente
# a partir de las Entities, sin tener que escribir el SQL a mano
spring.jpa.hibernate.ddl-auto=update

# Dialecto específico para que Hibernate genere SQL compatible con MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect